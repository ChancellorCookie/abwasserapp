# ============================================
# ZE1 Report Generator - Docker Compose
# ============================================

version: "3.8"

services:
  shiny:
    build: .
    image: ze1-report-generator:latest
    container_name: ze1_report_generator
    ports:
      - "3838:3838"
    volumes:
      # App-Daten (Config, QC, Kalibrierung, Messdaten) persistent halten
      - ./data/R_Viewer/Calibration:/srv/shiny-server/myShinyApps/R_Viewer/Calibration
      - ./data/R_Viewer/QC:/srv/shiny-server/myShinyApps/R_Viewer/QC
      - ./data/R_Viewer/Config:/srv/shiny-server/myShinyApps/R_Viewer/Config
      # Messdaten-Verzeichnisse
      - ./data/R_Viewer/ICP-OES:/srv/shiny-server/myShinyApps/R_Viewer/ICP-OES
      - ./data/R_Viewer/Multielement:/srv/shiny-server/myShinyApps/R_Viewer/Multielement
      - ./data/R_Viewer/Pt-Spezies:/srv/shiny-server/myShinyApps/R_Viewer/Pt-Spezies
      - ./data/R_Viewer/Platin_Gesamt:/srv/shiny-server/myShinyApps/R_Viewer/Platin\ Gesamt
      - ./data/R_Viewer/Bromid_Bromat:/srv/shiny-server/myShinyApps/R_Viewer/Bromid\ Bromat
      - ./data/R_Viewer/gc-ms-fid:/srv/shiny-server/myShinyApps/R_Viewer/gc-ms-fid
      # Log- und Nutzer-Dateien
      - ./data/R_Viewer/R_Viewer.usr:/srv/shiny-server/myShinyApps/R_Viewer/R_Viewer.usr
      - ./data/R_Viewer/R_Viewer.pw:/srv/shiny-server/myShinyApps/R_Viewer/R_Viewer.pw
      - ./data/R_Viewer/log.usr:/srv/shiny-server/myShinyApps/R_Viewer/log.usr
      - ./data/R_Viewer/defaults.log:/srv/shiny-server/myShinyApps/R_Viewer/defaults.log
      # SQLite Defaults
      - ./data/R_Viewer/defaults.sqlite:/srv/shiny-server/myShinyApps/R_Viewer/defaults.sqlite
      # Shiny Server Logs
      - ./logs/shiny-server:/var/log/shiny-server
    restart: unless-stopped
    environment:
      - TZ=Europe/Berlin
    logging:
      driver: "json-file"
      options:
        max-size: "10m"
        max-file: "3"
